<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory Dollhouse</title>

    <!-- Three.js -->
    <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;
            background: #d8d0c7;
        }

        #app {
            position: fixed;
            inset: 0;
        }

        canvas {
            display: block;
        }

        /* TITLE */

        #title {
            position: fixed;
            top: 28px;
            left: 32px;
            z-index: 100;
            pointer-events: none;
        }

        #title h1 {
            margin: 0;
            font-size: 19px;
            font-weight: 600;
            letter-spacing: 3px;
        }

        #title p {
            margin: 7px 0 0;
            font-size: 11px;
            letter-spacing: 1px;
            opacity: 0.55;
        }

        /* HELP */

        #help {
            position: fixed;
            left: 32px;
            top: 88px;

            z-index: 100;

            padding: 11px 13px;

            border-radius: 12px;

            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(10px);

            font-size: 11px;
            line-height: 1.6;
            opacity: 0.7;

            pointer-events: none;
        }

        /* TOOLS */

        #tools {
            position: fixed;

            top: 26px;
            right: 28px;

            z-index: 200;

            display: flex;
            gap: 6px;

            padding: 7px;

            border-radius: 15px;

            background: rgba(255, 255, 255, 0.84);
            backdrop-filter: blur(15px);

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.12);
        }

        #tools button {
            border: none;

            padding: 9px 12px;

            border-radius: 9px;

            background: rgba(0, 0, 0, 0.06);

            cursor: pointer;

            font-size: 12px;
        }

        #tools button:hover {
            background: rgba(0, 0, 0, 0.12);
        }

        #tools button.active {
            background: #171717;
            color: white;
        }

        #deleteBtn {
            color: #ad2929;
        }

        /* INSPECTOR */

        #inspector {
            position: fixed;

            top: 82px;
            right: 28px;

            width: 230px;

            z-index: 150;

            padding: 13px 15px;

            border-radius: 14px;

            background: rgba(255, 255, 255, 0.74);
            backdrop-filter: blur(12px);

            font-size: 11px;
            line-height: 1.55;

            opacity: 0;
            pointer-events: none;

            transition: opacity 0.2s;
        }

        #inspector.visible {
            opacity: 1;
        }

        #selectedName {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        #selectedMeta {
            opacity: 0.58;
        }

        /* INPUT */

        #generator {
            position: fixed;

            left: 50%;
            bottom: 26px;

            transform: translateX(-50%);

            display: flex;
            align-items: center;
            gap: 7px;

            z-index: 200;

            padding: 9px;

            border-radius: 18px;

            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);

            box-shadow:
                0 16px 45px rgba(0, 0, 0, 0.16);
        }

        #promptInput {
            width: 340px;

            padding: 11px 13px;

            border: none;
            outline: none;

            background: transparent;

            font-size: 14px;
        }

        #generateBtn,
        #clearBtn {
            border: none;

            padding: 11px 15px;

            border-radius: 12px;

            cursor: pointer;
        }

        #generateBtn {
            background: #171717;
            color: white;
        }

        #generateBtn:disabled {
            opacity: 0.35;
            cursor: wait;
        }

        #clearBtn {
            background: rgba(0, 0, 0, 0.07);
        }

        /* STATUS */

        #status {
            position: fixed;

            left: 32px;
            bottom: 30px;

            z-index: 100;

            font-size: 12px;

            opacity: 0.72;

            max-width: 500px;
        }

        #firebaseBadge {
            position: fixed;

            left: 32px;
            bottom: 52px;

            z-index: 100;

            font-size: 10px;
            letter-spacing: 1px;

            opacity: 0.45;
        }

        @media (max-width: 900px) {

            #promptInput {
                width: 210px;
            }

            #tools {
                top: 90px;
            }

            #inspector {
                top: 145px;
            }
        }
    </style>
</head>

<body>

    <div id="app"></div>

    <div id="title">
        <h1>MEMORY DOLLHOUSE</h1>
        <p>AI-GENERATED MEMORIES IN 3D SPACE</p>
    </div>

    <div id="help">
        Drag empty space → rotate room<br>
        Scroll → zoom<br>
        Click object → select<br>
        Move / Rotate / Scale → edit object
    </div>

    <div id="tools">

        <button id="moveBtn" class="active">
            Move
        </button>

        <button id="rotateBtn">
            Rotate
        </button>

        <button id="scaleBtn">
            Scale
        </button>

        <button id="playBtn">
            ▶ Sequence
        </button>

        <button id="resetCameraBtn">
            Reset View
        </button>

        <button id="deleteBtn">
            Delete
        </button>

    </div>

    <div id="inspector">

        <div id="selectedName"></div>

        <div id="selectedMeta"></div>

    </div>

    <div id="firebaseBadge">
        FIREBASE • SKYLER'S ROOM
    </div>

    <div id="status">
        Connecting to Firebase...
    </div>

    <div id="generator">

        <input id="promptInput" type="text" placeholder="Add something to your memory room..." autocomplete="off">

        <button id="generateBtn">
            Add Object
        </button>

        <button id="clearBtn">
            Clear
        </button>

    </div>

    <script type="module" src="main.js"></script>

</body>

</html>
